<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="1200" height="420" role="img" aria-labelledby="title desc">
  <title id="title">TaskbarDrawer 收纳与展开示意</title>
  <desc id="desc">一组窗口收进任务栏上的一枚场景胶囊，点一下原位展开。</desc>
  <rect width="1200" height="420" rx="18" fill="#0f1115"/>
  <text x="48" y="58" fill="#f2f4f7" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="26" font-weight="700">把一组窗口收成场景，再原位展开</text>
  <text x="48" y="90" fill="#9aa0a6" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="15">场景 = 一组窗口 + 保存的位置；任务栏上只留一枚胶囊</text>

  <!-- before -->
  <text x="48" y="138" fill="#9aa0a6" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="14">收纳前</text>
  <g>
    <rect x="48" y="156" width="360" height="72" rx="10" fill="#20232b" stroke="#2d313a"/>
    <circle cx="72" cy="180" r="6" fill="#56ccf2"/>
    <rect x="88" y="172" width="150" height="8" rx="4" fill="#e8eaed" opacity="0.9"/>
    <rect x="88" y="190" width="250" height="6" rx="3" fill="#9aa0a6" opacity="0.55"/>
  </g>
  <g>
    <rect x="48" y="238" width="360" height="72" rx="10" fill="#20232b" stroke="#2d313a"/>
    <circle cx="72" cy="262" r="6" fill="#bb6bd9"/>
    <rect x="88" y="254" width="190" height="8" rx="4" fill="#e8eaed" opacity="0.9"/>
    <rect x="88" y="272" width="220" height="6" rx="3" fill="#9aa0a6" opacity="0.55"/>
  </g>
  <g>
    <rect x="48" y="320" width="360" height="56" rx="10" fill="#20232b" stroke="#2d313a"/>
    <circle cx="72" cy="344" r="6" fill="#f2c94c"/>
    <rect x="88" y="336" width="120" height="8" rx="4" fill="#e8eaed" opacity="0.9"/>
    <rect x="88" y="354" width="210" height="6" rx="3" fill="#9aa0a6" opacity="0.55"/>
  </g>

  <!-- arrow -->
  <path d="M430 250 H 520" stroke="#56ccf2" stroke-width="3" stroke-linecap="round"/>
  <path d="M510 240 L 522 250 L 510 260" fill="none" stroke="#56ccf2" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="432" y="232" fill="#56ccf2" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="14">收纳</text>

  <!-- taskbar + capsule -->
  <text x="560" y="138" fill="#9aa0a6" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="14">任务栏</text>
  <rect x="540" y="300" width="330" height="56" rx="12" fill="#1b1d23" stroke="#2d313a"/>
  <rect x="660" y="286" width="112" height="42" rx="10" fill="#2a2e37" stroke="#f2c94c" stroke-width="1.5"/>
  <circle cx="682" cy="307" r="8" fill="#f2c94c"/>
  <text x="698" y="312" fill="#f2f4f7" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="14" font-weight="600">场景 1</text>
  <text x="560" y="384" fill="#9aa0a6" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="13">胶囊 = 场景入口：左键收起 / 展开，右键管理</text>

  <!-- arrow -->
  <path d="M890 250 H 960" stroke="#56ccf2" stroke-width="3" stroke-linecap="round"/>
  <path d="M950 240 L 962 250 L 950 260" fill="none" stroke="#56ccf2" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="892" y="232" fill="#56ccf2" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="14">展开</text>

  <!-- after -->
  <text x="1000" y="138" fill="#9aa0a6" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="14">原位展开</text>
  <g>
    <rect x="940" y="156" width="210" height="72" rx="10" fill="#20232b" stroke="#f2c94c" stroke-opacity="0.55"/>
    <circle cx="1128" cy="172" r="9" fill="#f2c94c"/>
    <text x="1120" y="177" fill="#0f1115" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="10" font-weight="700">1</text>
    <rect x="964" y="172" width="130" height="8" rx="4" fill="#e8eaed" opacity="0.9"/>
    <rect x="964" y="190" width="150" height="6" rx="3" fill="#9aa0a6" opacity="0.55"/>
  </g>
  <g>
    <rect x="960" y="238" width="210" height="72" rx="10" fill="#20232b" stroke="#f2c94c" stroke-opacity="0.55"/>
    <circle cx="1148" cy="254" r="9" fill="#f2c94c"/>
    <text x="1140" y="259" fill="#0f1115" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="10" font-weight="700">1</text>
    <rect x="984" y="254" width="140" height="8" rx="4" fill="#e8eaed" opacity="0.9"/>
    <rect x="984" y="272" width="135" height="6" rx="3" fill="#9aa0a6" opacity="0.55"/>
  </g>
  <g>
    <rect x="980" y="320" width="170" height="56" rx="10" fill="#20232b" stroke="#f2c94c" stroke-opacity="0.55"/>
    <circle cx="1148" cy="340" r="9" fill="#f2c94c"/>
    <text x="1140" y="345" fill="#0f1115" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="10" font-weight="700">1</text>
    <rect x="1004" y="340" width="115" height="8" rx="4" fill="#e8eaed" opacity="0.9"/>
    <rect x="1004" y="358" width="90" height="6" rx="3" fill="#9aa0a6" opacity="0.55"/>
  </g>
</svg>
